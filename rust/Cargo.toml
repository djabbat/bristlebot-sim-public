[package]
name = "bristlebot-sim"
version = "3.0.0"
edition = "2021"
description = "Bristlebot swarm τ_sick simulation of mosaic aging (corrected physics, Rust)"
license = "GPL-3.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statrs = "0.17"

[profile.release]
opt-level = 3
